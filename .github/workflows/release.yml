# Produces the published binaries and attaches them to a GitHub release.
#
# Triggered by pushing a version tag, e.g.:
#     git tag v1.0.0 && git push origin v1.0.0
#
# Three downloads are published:
#   AppGeekSetup.exe   installer, self-contained, Start menu + uninstall entry
#   AppGeek.exe        portable, self-contained, no prerequisites  (~63 MB)
#   AppGeek-light.exe  portable, needs the .NET 8 Desktop Runtime  (~0.5 MB)
#
# SHA-256 hashes are published alongside them so a download can be verified.
# The binaries are not code signed. Windows SmartScreen will warn on first run;
# verifying the published hash is the way to check what you downloaded.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version to stamp
        id: ver
        shell: pwsh
        run: |
          # A tag push is the normal path: v1.0.1 -> 1.0.1
          # A manual run has no tag, so fall back to the version in the csproj.
          $ref = '${{ github.ref_name }}'
          if ($ref -match '^v(\d+\.\d+\.\d+(\.\d+)?)$') {
            $version = $Matches[1]
          } else {
            [xml]$proj = Get-Content src/AppGeek/AppGeek.csproj
            $version = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
            Write-Host "No version tag on this run - falling back to the csproj version."
          }
          if (-not $version) { throw 'Could not determine a version to stamp.' }
          Write-Host "Stamping version $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish self-contained build
        run: >
          dotnet publish src/AppGeek/AppGeek.csproj
          --configuration Release
          --runtime win-x64
          -p:Version=${{ steps.ver.outputs.version }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish/standalone

      - name: Publish framework-dependent build
        run: >
          dotnet publish src/AppGeek/AppGeek.csproj
          --configuration Release
          --runtime win-x64
          -p:Version=${{ steps.ver.outputs.version }}
          --self-contained false
          -p:PublishSingleFile=true
          --output publish/light

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'Inno Setup not on the runner image - installing it.'
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" 'installer\AppGeek.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/standalone/AppGeek.exe dist/AppGeek.exe
          Copy-Item publish/light/AppGeek.exe      dist/AppGeek-light.exe
          if (-not (Test-Path dist/AppGeekSetup.exe)) { throw 'AppGeekSetup.exe was not produced.' }

          # Publish hashes so anyone can verify what they downloaded.
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Append -Encoding utf8
            Write-Host "$hash  $($_.Name)"
          }

      - name: Check the version was actually stamped
        shell: pwsh
        run: |
          $expected = '${{ steps.ver.outputs.version }}'
          $bad = @()
          foreach ($name in 'AppGeek.exe','AppGeek-light.exe','AppGeekSetup.exe') {
            $path = Join-Path 'dist' $name
            $info = (Get-Item $path).VersionInfo
            $file = $info.FileVersion
            $prod = $info.ProductVersion
            Write-Host "$name  FileVersion=$file  ProductVersion=$prod"
            if ($file -notlike "$expected*" -and $prod -notlike "$expected*") {
              $bad += "$name reports $file / $prod, expected $expected"
            }
          }
          if ($bad.Count) {
            $bad | ForEach-Object { Write-Host "FAIL: $_" }
            throw 'The published binaries do not carry the release version. Refusing to publish a mislabelled release.'
          }
          Write-Host "OK - all three binaries report $expected"

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: appgeek-${{ github.ref_name }}
          path: dist/*

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
